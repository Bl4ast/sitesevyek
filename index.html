<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lore - Personagens</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="custom-cursor-dot"></div>
    <div id="custom-cursor-glow"></div>

    <div id="intro-container">
        <button id="btn-start" class="btn-start">PLAY</button>
        <div id="stars-bg"></div>
        <div class="moon-container hidden" id="moon-wrapper">
            <div id="moon-phase">
                <div class="moon-half-light"></div>
                <div class="moon-half-dark"></div>
                <div class="moon-flap-left"></div>
                <div class="moon-flap-right"></div>
            </div>
        </div>
        
        <div id="selection-screen" class="hidden">
            <div class="split-panel split-left" id="panel-left">
                <div class="char-square" id="square-left">
                    <div class="char-img" id="img-left"></div>
                    <span class="char-name">???</span>
                </div>
            </div>
            
            <div class="split-divider" id="divider-line"></div>
            
            <div class="split-panel split-right" id="panel-right">
                <div class="char-square" id="square-right">
                    <div class="char-img" id="img-right"></div>
                    <span class="char-name">?????</span>
                </div>
            </div>
        </div>
    </div>

    <div id="zoom-transition"></div>

    <main id="profile-container" class="hidden">
        <div class="glass-panel">
            
            <!-- COLUNA ESQUERDA: Arte Livre -->
            <div class="panel-left-art">
                <div class="character-full-art"></div>
            </div>

            <!-- COLUNA DIREITA: Dashboard -->
            <div class="panel-right-content">
                <div class="box-playlist card">
                    <h3>PLAYLIST</h3>
                </div>
                
                <div class="box-arte-lukea card">
                    <h3>ARTE COM O PERSONAGEM DO LUKEA</h3>
                </div>

                <div class="box-info">
                    <div class="stats-grid">
                        <div class="stat-item"><span>ANIVERSÁRIO</span><strong id="stat-aniversario">--</strong></div>
                        <div class="stat-item"><span>IDADE</span><strong id="stat-idade">--</strong></div>
                        <div class="stat-item"><span>ALTURA</span><strong id="stat-altura">--</strong></div>
                        <div class="stat-item"><span>GÊNERO</span><strong id="stat-genero">--</strong></div>
                        <div class="stat-item"><span>SIGNO</span><strong id="stat-signo">--</strong></div>
                        <div class="stat-item"><span>SEXUALIDADE</span><strong id="stat-sexualidade">--</strong></div>
                        <div class="btn-face-futuro">FACE<br>FUTURO</div>
                    </div>
                </div>

                <div class="box-lore-btn">
                    <button id="btn-ler-lore">LER LORE ></button>
                </div>

                <div class="box-heads">
                    <div class="head-icon head-lukea">LUKEA</div>
                    <div class="head-icon head-ficha" id="btn-ficha">FICHA GERAL</div>
                </div>

                <div class="box-botoes-neon">
                    <button class="btn-neon full-width" id="btn-personalidade">PERSONALIDADE</button>
                    <button class="btn-neon" id="btn-agradecimentos">AGRADECIMENTOS</button>
                    <button class="btn-neon" id="btn-gostos">GOSTOS</button>
                    <button class="btn-neon" id="btn-aprovacao">APROVAÇÃO</button>
                    <button class="btn-neon" id="btn-qa">Q&A</button>
                    <button class="btn-neon full-width" id="btn-artes">ARTES ✧</button>
                </div>
            </div>
        </div>
    </main>

    <!-- ✨ ESTRUTURA DO MODAL (POP-UP) ✨ -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-box">
            <span id="modal-close">&times;</span>
            <div id="modal-header">TÍTULO</div>
            <div id="modal-body">
                <!-- O conteúdo entra aqui via JavaScript -->
            </div>
        </div>
    </div>

    <!-- ✨ CONTAINER DINÂMICO DE LORE (GERADO PELO LORE.JS) ✨ -->
    <div id="lore-wrapper"></div>

    <script src="js/banco.js"></script>
    <script src="js/lore.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
